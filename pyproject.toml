[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "careflow-dual-rag"
version = "2.5.0"
description = "Dual-Mode Medical Chatbot: Graph RAG Diagnostic Triage & WHO Guidelines Vector RAG"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "aiosqlite>=0.20.0",
    "qdrant-client>=1.8.0",
    "google-genai>=1.0.0",
    "groq>=0.9.0",
    "networkx>=3.2.0",
    "pandas>=2.2.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "langchain-core>=0.1.0",
    "langgraph>=0.0.26",
    "langchain>=0.1.0",
    "langchain-openai>=0.1.0",
    "langchain-groq>=0.1.0",
    "langchain-google-genai>=1.0.0",
    "langchain-community<0.3.0",
    "beautifulsoup4>=4.12.0",
    "redis>=8.1.0",
    "nest-asyncio>=1.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]
eval = [
    "ragas>=0.1.0",
    "pytest>=8.0.0"
]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.setuptools]
packages = ["app"]
