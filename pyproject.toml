[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "careflow-dual-rag"
version = "2.5.0"
description = "Dual-Mode Medical Chatbot: Graph RAG Diagnostic Triage & WHO Guidelines Vector RAG"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# Source of truth for runtime dependencies. requirements.txt mirrors this list because
# Vercel's Python builder reads that file; keep the two in sync.
dependencies = [
    # web framework
    "fastapi>=0.110.0",
    "starlette>=0.36.0",
    "uvicorn[standard]>=0.28.0",
    "python-multipart>=0.0.9",
    # config & validation
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    # persistence
    "sqlalchemy>=2.0.28",
    "aiosqlite>=0.20.0",
    "greenlet>=3.0.0",
    "redis>=5.0.0",
    # retrieval
    "qdrant-client>=1.8.0",
    "networkx>=3.2.0",
    "pandas>=2.2.0",
    # LLM providers
    "google-genai>=1.0.0",
    "groq>=0.9.0",
    "openai>=1.0.0",
    "langchain-core>=0.1.0",
    "langchain>=0.1.0",
    "langchain-openai>=0.1.0",
    "langchain-groq>=0.1.0",
    "langchain-google-genai>=1.0.0",
    "langchain-community>=0.0.25",
    "langgraph>=0.0.26",
    # misc
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "nest-asyncio>=1.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

# Quantitative evaluation harness (scripts/evaluate_rag.py).
eval = [
    "ragas>=0.1.0",
    "datasets>=2.16.0",
]

# Local embedding and reranking models. NOT installed on Vercel -- torch alone exceeds
# the 250MB serverless function limit, so production uses the hosted Modal embedder
# (EMBEDDER_ENDPOINT_URL). Install locally to run the full stack offline:
#   uv pip install -e '.[local-embeddings]'
local-embeddings = [
    "sentence-transformers>=2.6.0",
    "torch>=2.2.0",
]

[tool.setuptools]
packages = ["careflow"]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
asyncio_mode = "auto"
# Integration tests hit live Qdrant/Gemini/Groq and exhaust the Gemini 15 req/min free
# tier, so they are excluded by default. Run them deliberately with:
#   pytest -m integration
addopts = "-m 'not integration'"
markers = [
    "integration: requires live external services (Qdrant, LLM APIs) and real API keys",
    "slow: downloads models or otherwise takes >10s",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
