<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAG Evaluation Metrics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Tajawal:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <style>
    .metrics-container {
      padding: 30px;
      max-width: 1200px;
      margin: 0 auto;
      color: var(--text-primary);
    }
    .metrics-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }
    .metric-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      backdrop-filter: blur(10px);
    }
    .metric-value {
      font-size: 2rem;
      font-weight: 700;
      color: var(--accent-primary);
      margin: 10px 0;
    }
    .metric-title {
      font-size: 0.9rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .results-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      overflow: hidden;
    }
    .results-table th, .results-table td {
      padding: 15px;
      text-align: left;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    .results-table th {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-secondary);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.85rem;
    }
    .results-table tr:hover {
      background: rgba(255, 255, 255, 0.05);
    }
    .error-msg {
      color: #ef4444;
      text-align: center;
      padding: 40px;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-secondary);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }
    .back-btn:hover {
      color: var(--text-primary);
    }
    .status-badge {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: 600;
      background: rgba(16, 185, 129, 0.2);
      color: #10b981;
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <header class="app-header">
      <div class="header-left">
        <a href="/" class="back-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
          Back to Dashboard
        </a>
      </div>
      <div class="brand-info">
        <h1>RAG <span class="gradient-text">Evaluation Metrics</span></h1>
      </div>
      <div class="header-right"></div>
    </header>

    <div class="app-body" style="overflow-y: auto;">
      <div class="metrics-container">
        <div class="metrics-header">
          <h2>Aggregate Performance (Ragas)</h2>
          <span class="status-badge" id="eval-status">Loading...</span>
        </div>

        <div class="metrics-grid" id="metrics-grid">
          <!-- Metrics injected here -->
        </div>

        <h2>Detailed Question Breakdown</h2>
        <div style="overflow-x: auto;">
          <table class="results-table">
            <thead>
              <tr>
                <th>Question</th>
                <th>Answer</th>
                <th>Chunks</th>
                <th>Latency (s)</th>
                <th>Faithfulness</th>
                <th>Relevancy</th>
                <th>Precision</th>
                <th>Recall</th>
                <th>Similarity</th>
              </tr>
            </thead>
            <tbody id="table-body">
              <tr><td colspan="9" style="text-align: center;">Fetching data...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    async function loadEvaluationData() {
      try {
        const response = await fetch('/static/evaluation_results.json');
        if (!response.ok) {
          throw new Error('Evaluation data not found. Please run the evaluation script first.');
        }
        
        const data = await response.json();
        const avgs = data.averages;
        const details = data.detailed_results;

        // Update status
        document.getElementById('eval-status').textContent = 'Evaluation Loaded';

        // Render aggregate cards
        const metricsGrid = document.getElementById('metrics-grid');
        metricsGrid.innerHTML = `
          <div class="metric-card">
            <div class="metric-title">Faithfulness</div>
            <div class="metric-value">${(avgs.faithfulness * 100).toFixed(1)}%</div>
          </div>
          <div class="metric-card">
            <div class="metric-title">Answer Relevancy (Citation)</div>
            <div class="metric-value">${(avgs.answer_relevancy * 100).toFixed(1)}%</div>
          </div>
          <div class="metric-card">
            <div class="metric-title">Precision@k</div>
            <div class="metric-value">${(avgs.context_precision * 100).toFixed(1)}%</div>
          </div>
          <div class="metric-card">
            <div class="metric-title">Recall@k</div>
            <div class="metric-value">${(avgs.context_recall * 100).toFixed(1)}%</div>
          </div>
          <div class="metric-card">
            <div class="metric-title">Answer Similarity</div>
            <div class="metric-value">${(avgs.answer_similarity * 100).toFixed(1)}%</div>
          </div>
          <div class="metric-card">
            <div class="metric-title">Avg Latency</div>
            <div class="metric-value">${avgs.latency_sec.toFixed(2)}s</div>
          </div>
        `;

        // Render detailed table
        const tableBody = document.getElementById('table-body');
        tableBody.innerHTML = '';
        
        details.forEach(row => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td style="max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" title="${row.question}">${row.question}</td>
            <td style="max-width: 250px; font-size: 0.85rem; max-height: 100px; overflow-y: auto; display: block; margin: 10px 0;">${row.answer ? row.answer : '-'}</td>
            <td style="max-width: 250px; font-size: 0.8rem; max-height: 100px; overflow-y: auto; display: block; margin: 10px 0; color: var(--text-secondary); background: rgba(0,0,0,0.2); padding: 5px; border-radius: 4px;">${row.contexts ? row.contexts.join('<br><br>') : '-'}</td>
            <td>${row.latency_sec ? row.latency_sec.toFixed(2) : '-'}</td>
            <td>${row.faithfulness ? (row.faithfulness * 100).toFixed(1) + '%' : '-'}</td>
            <td>${row.answer_relevancy ? (row.answer_relevancy * 100).toFixed(1) + '%' : '-'}</td>
            <td>${row.context_precision ? (row.context_precision * 100).toFixed(1) + '%' : '-'}</td>
            <td>${row.context_recall ? (row.context_recall * 100).toFixed(1) + '%' : '-'}</td>
            <td>${row.answer_similarity ? (row.answer_similarity * 100).toFixed(1) + '%' : '-'}</td>
          `;
          tableBody.appendChild(tr);
        });

      } catch (err) {
        document.getElementById('eval-status').textContent = 'Error';
        document.getElementById('eval-status').style.color = '#ef4444';
        document.getElementById('eval-status').style.background = 'rgba(239, 68, 68, 0.2)';
        
        document.getElementById('metrics-grid').innerHTML = `
          <div style="grid-column: 1 / -1;" class="error-msg">
            <p>${err.message}</p>
            <p style="margin-top: 10px; font-size: 0.9rem; color: var(--text-secondary);">
              Run <code>python scripts/evaluate_rag.py</code> to generate the results.
            </p>
          </div>
        `;
        document.getElementById('table-body').innerHTML = `<tr><td colspan="7" style="text-align: center;">No data available</td></tr>`;
      }
    }

    // Load data on start
    document.addEventListener('DOMContentLoaded', loadEvaluationData);
  </script>
</body>
</html>
